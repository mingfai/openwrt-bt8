name: Build BT8 firmware

# Builds the ASUS ZenWiFi BT8 image from this branch (upstream OpenWrt snapshot +
# the BT8 delta commits) and publishes it as a GitHub pre-release.
#
# Mirrors mingfai/home openwrt-bt8-installer/docker/build-fw.sh: feeds, two-pass
# defconfig with the package whitelist, verify, build — plus a post-build manifest
# gate so a silently-stripped package fails the job instead of shipping (r9 scar
# tissue: defconfig dropped mwan3/usteer/luci on a fresh checkout).

on:
  push:
    branches: ['25.12.5-rebase']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create/update (empty = build only, no release)'
        required: false
        default: 'v25.12.5-bt8-r11'

permissions:
  contents: write

concurrency:
  group: build-bt8-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || 'v25.12.5-bt8-r11' }}
  # Keep in sync with openwrt-bt8-installer/docker/build-fw.sh WHITELIST.
  WHITELIST: python3-light python3-base python3-logging luci sudo curl ethtool usteer luci-app-usteer mwan3 luci-app-mwan3
  # Every package the image MUST contain (from the committed .config); checked in the manifest.
  GATE: mwan3 luci-app-mwan3 usteer luci-app-usteer luci wireguard-tools kmod-wireguard kmod-tcp-bbr wpad-mbedtls sudo curl ethtool python3-light ip-full resolveip
  OUT: bin/targets/mediatek/filogic

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: Cache source downloads (dl/)
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ hashFiles('.config', 'feeds.conf.default', 'package/kernel/mt76/Makefile', 'package/firmware/wireless-regdb/Makefile', 'include/kernel-6.12') }}
          restore-keys: dl-

      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (two-pass defconfig + whitelist + verify)
        run: |
          set -euo pipefail
          test -f .config || { echo "FATAL: committed .config missing"; exit 1; }
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_asus_zenwifi-bt8=y' .config
          grep -q '^CONFIG_AUTOREMOVE=y' .config || echo 'CONFIG_AUTOREMOVE=y' >> .config
          make defconfig
          for pkg in $WHITELIST; do
            sed -i "s|^# CONFIG_PACKAGE_${pkg} is not set|CONFIG_PACKAGE_${pkg}=y|" .config
          done
          make defconfig
          missing=""
          for pkg in $WHITELIST $GATE; do
            grep -q "^CONFIG_PACKAGE_${pkg}=y" .config || missing="${missing} ${pkg}"
          done
          if [ -n "$missing" ]; then echo "FATAL: packages stripped by defconfig:${missing}"; exit 1; fi
          echo "config OK"; ./scripts/diffconfig.sh > diffconfig.txt; wc -l diffconfig.txt

      - name: Download sources
        run: make download -j8 || make download -j1 V=s

      - name: Build
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tail -n 200 || { echo "::warning::parallel build failed, retrying single-threaded with V=s"; make -j1 V=s 2>&1 | tail -n 400; }
          df -h /

      - name: Manifest gate
        run: |
          set -euo pipefail
          ls -la "$OUT"
          M=$(ls "$OUT"/*asus_zenwifi-bt8*.manifest)
          missing=""
          for pkg in $GATE; do grep -q "^${pkg} - " "$M" || missing="${missing} ${pkg}"; done
          if [ -n "$missing" ]; then echo "FATAL: image manifest lacks:${missing}"; exit 1; fi
          test -s "$OUT"/*asus_zenwifi-bt8-squashfs-sysupgrade.bin
          test -s "$OUT"/*asus_zenwifi-bt8-factory.bin
          echo "manifest OK ($(wc -l < "$M") packages)"

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$OUT"/*asus_zenwifi-bt8*.bin "$OUT"/*asus_zenwifi-bt8*.manifest out/
          cp "$OUT"/config.buildinfo out/config-$RELEASE_TAG.buildinfo
          cp "$OUT"/feeds.buildinfo out/feeds-$RELEASE_TAG.buildinfo
          cp diffconfig.txt out/diffconfig-$RELEASE_TAG.txt
          (cd out && sha256sum * > sha256sums.txt && cat sha256sums.txt)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bt8-${{ env.RELEASE_TAG }}-${{ github.sha }}
          path: out/
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            logs/
            .config
            diffconfig.txt
          if-no-files-found: ignore

      - name: Release (pre-release; r10 stays "Latest" until bt8a proves this image)
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "Upstream OpenWrt v25.12.5 snapshot + BT8 delta, built from \`${GITHUB_SHA}\` on branch \`${GITHUB_REF_NAME}\` by workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo
            echo "Delta over upstream (see CHANGES.md): files/ overlay (vpn-ssid-template, 00-disable-bridge-migration), mt76 bump to 018f603 + mt7996 NULL-sta patch, wireless-regdb 6 GHz patches 501/502/503 (503 refreshed for regdb 2026.05.30: HK hunk dropped, upstream now ships HK at 24 dBm), MT798x 2.5G PHY write_mmd delay, baked package set."
            echo
            echo "Flash with \`sysupgrade -n\` (never \`-v\`). Pre-release until verified on bt8a."
            echo
            echo '```'; cat out/sha256sums.txt; echo '```'
          } > notes.md
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "r11 — rebase to upstream 25.12.5" --notes-file notes.md
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber out/*
          echo "release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
